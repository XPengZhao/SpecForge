model:
  target_model_path: "/path/to/GLM-5.2"
  draft_model_config: "configs/glm-5.2-dspark.json"
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  lm_head_key: "lm_head.weight"
  torch_dtype: "bfloat16"
  trust_remote_code: true

data:
  hidden_states_path: "./cache/hidden_states/glm-5.2-dspark"
  max_length: 4096
  cache_dir: "./cache"
  dataloader_num_workers: 0

training:
  strategy: "dspark"
  num_epochs: 1
  max_steps: 1
  batch_size: 1
  accumulation_steps: 1
  fsdp_sharding: "FULL_SHARD"
  learning_rate: 1.0e-5
  warmup_ratio: 0.0
  max_grad_norm: 0.5
  attention_backend: "flex_attention"
  tp_size: 1
  num_anchors: 32
  dspark_ce_loss_alpha: 1.0
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 1
  log_interval: 1
  dist_timeout: 120
  seed: 42

run_id: "glm-5.2-dspark-offline-smoke"
output_dir: "./outputs/glm-5.2-dspark-offline-smoke"

deployment:
  mode: "local_colocated"
  trainer:
    nnodes: 1
    nproc_per_node: 8
