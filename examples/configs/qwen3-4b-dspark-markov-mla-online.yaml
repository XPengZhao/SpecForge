# Single-node 8 x 96 GB starting recipe: GPU 0 captures; GPUs 1-7 train.
# Accepts conversation JSONL directly; no EAGLE vocabulary preparation is needed.
model:
  target_model_path: "Qwen/Qwen3-4B"
  draft_model_config: "configs/qwen3-4b-dspark-markov-mla.json"
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 4096
  chat_template: "qwen"
  build_dataset_num_proc: 8
  cache_dir: "./cache"
training:
  strategy: "dspark"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  accumulation_steps: 1
  fsdp_sharding: NO_SHARD
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  dspark_loss_mode: original
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  attention_backend: "flex_attention"
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42
runtime:
  producer_lease: 8
  # Five auxiliary layers plus the final layer: ~120 MiB/sample at 4096 tokens.
  # 128 queued samples ~15 GiB, with headroom for in-flight captures in 32 GiB.
  in_flight_high_watermark: 128
  in_flight_low_watermark: 96
tracking:
  report_to: "none"
run_id: "qwen3-4b-dspark-markov-mla"
output_dir: "./outputs/qwen3-4b-dspark-markov-mla"
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 7
  disaggregated:
    control_dir: "outputs/qwen3-4b-dspark-markov-mla/control"
    consumer_state_dir: "outputs/qwen3-4b-dspark-markov-mla/consumer-state"
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["1", "2", "3", "4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
          mem_fraction_static: 0.5
